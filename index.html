<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Ticket System Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      padding: 30px;
    }

    .ticket {
      max-width: 500px;
      margin: auto;
      padding: 25px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px #ccc;
    }

    h1 {
      margin-top: 0;
      color: #14532d;
    }

    .route {
      display: flex;
      justify-content: space-between;
      margin: 20px 0;
    }

    .station {
      font-size: 20px;
      font-weight: bold;
    }

    .info {
      border-top: 1px solid #ddd;
      padding-top: 15px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #14532d;
      color: white;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="ticket">
    <h1>Train Ticket System Application</h1>

    <div class="route">
      <div class="station">Chennai</div>
      <div>to</div>
      <div class="station">Bangalore</div>
    </div>

    <div class="info">
      <p><strong>Train:</strong> Intercity Express</p>
      <p><strong>Date:</strong> 20 Sep 2026</p>
      <p><strong>Coach:</strong> A1</p>
      <p><strong>Seat:</strong> 24</p>
    </div>

    <button>Download Ticket</button>
  </div>

</body>
</html>
